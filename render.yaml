services:
  - type: web
    runtime: docker
    name: notemind-api-syoung0011
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notemind-db-syoung0011
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        value: https://notemind-web-syoung0011.onrender.com
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-v4
      - key: EMBEDDING_DIMENSIONS
        value: 1024
      - key: CHAT_MODEL
        value: qwen-plus
      - key: RETRIEVAL_MIN_SCORE
        value: 0.50

  - type: web
    runtime: static
    name: notemind-web-syoung0011
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://notemind-api-syoung0011.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: notemind-db-syoung0011
    region: singapore
    plan: free
    databaseName: notemind
    user: notemind
